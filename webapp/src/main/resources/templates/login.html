<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <style>
        body {
            font-size: 14px; /* Base font size */
        }
        .login-card {
            max-width: 400px;
            margin: auto;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .login-title {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .login-subtitle {
            font-size: 0.875rem;
            color: #6c757d;
            margin-bottom: 1.5rem;
        }
        .btn-login {
            background-color: black;
            color: white;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
        }
        .btn-login:hover {
            background-color: #333;
        }
        .btn-google {
            background-color: white;
            color: black;
            border: 1px solid #ddd;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
        }
        .btn-google:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-light">
<div class="d-flex flex-column min-vh-100 justify-content-center">
    <div class="login-card bg-white">
        <!-- Login Header -->
        <div class="text-center">
            <h4 class="login-title">Login</h4>
            <p class="login-subtitle">
                Enter your email and password to login to your account.
            </p>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="johndoe"
                        required
                />
                <div class="invalid-feedback">Please enter a valid username.</div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label for="password" class="form-label">Password</label>
                    <a href="#" class="text-decoration-none text-black">Forgot your password?</a>
                </div>
                <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="******"
                        required
                        minlength="6"
                />
                <div class="invalid-feedback">
                    Password must be at least 6 characters long and alphanumeric.
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100 mb-2">Login</button>
        </form>

        <!-- Sign Up Link -->
        <div class="mt-4 text-center">
            <span class="text-secondary">Don't have an account?</span>
            <a href="#" class="text-decoration-none text-black">Sign up</a>
        </div>
    </div>
</div>

<!-- Bootstrap Validation Script -->
<script>
    (() => {
        "use strict";
        const forms = document.querySelectorAll("form");
        Array.from(forms).forEach((form) => {
            form.addEventListener(
                "submit",
                (event) => {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add("was-validated");
                },
                false
            );
        });
    })();
</script>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
