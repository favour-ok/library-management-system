<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Author Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-hover tbody tr:hover {
            background-color: #f8f9fa;
        }
        .table {
            font-size: 14px;
        }
        th {
            vertical-align: middle;
            height: 40px;
            font-weight: normal;
        }
        .dropdown-item {
            font-size: 14px;
            padding: 6px 8px;
            display: inline-flex;
            align-items: center;
        }
        .badge-custom {
            background-color: #e9ecef;
            color: #495057;
            font-weight: normal;
        }
    </style>
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Authors Management</h2>
        <div>
            <form th:action="@{/authors}" method="get" class="d-inline">
                <input type="text" name="keyword" placeholder="Search Authors..." class="form-control d-inline w-auto me-2">
                <button type="submit" class="btn btn-dark">Search</button>
            </form>
            <button sec:authorize="hasRole('ADMIN')" class="btn btn-dark ms-2" data-bs-toggle="offcanvas" data-bs-target="#addAuthorSheet">
                + Add Author
            </button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Author Name</th>
                <th>Description</th>
                <th sec:authorize="hasRole('ADMIN')">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="author : ${allAuthors.content}">
                <td th:text="${author.name}"></td>
                <td th:text="${author.description}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <div class="dropdown">
                        <button class="btn btn-link p-0" type="button" data-bs-toggle="dropdown">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ellipsis">
                                <circle cx="12" cy="12" r="1"></circle>
                                <circle cx="19" cy="12" r="1"></circle>
                                <circle cx="5" cy="12" r="1"></circle>
                            </svg>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <button class="dropdown-item"
                                        data-bs-toggle="offcanvas"
                                        data-bs-target="#editAuthorSheet"
                                        th:attr="data-author-id=${author.id}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil me-2" viewBox="0 0 16 16">
                                        <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                                    </svg>
                                    Edit
                                </button>
                            </li>
                            <li>
                                <form th:action="@{/remove-author/{id}(id=${author.id})}" method="post">
                                    <button type="submit" class="dropdown-item text-danger"
                                            onclick="return confirm('Are you sure you want to delete this author?');">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash me-2" viewBox="0 0 16 16">
                                            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                                            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
                                        </svg>
                                        Delete
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${allAuthors.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${allAuthors.first} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/authors(search=${search}, page=${allAuthors.number - 1}, size=${allAuthors.size})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(1, allAuthors.totalPages)}"
                th:classappend="${i == allAuthors.number + 1} ? 'active' : ''">
                <a class="page-link" th:href="@{/authors(search=${search}, page=${i - 1}, size=${allAuthors.size})}"
                   th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${allAuthors.last} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/authors(search=${search}, page=${allAuthors.number + 1}, size=${allAuthors.size})}">Next</a>
            </li>
        </ul>
    </nav>
</div>

<!-- Add Author Offcanvas -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="addAuthorSheet">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Add New Author</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <form th:action="@{/add-author}" method="post" th:object="${author}">

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control"
                       th:field="*{name}"
                       maxlength="100"
                       required>
                <div class="form-text">Author title (max 100 characters)</div>
                <small class="text-danger" th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"></small>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Description <span class="text-danger">*</span></label>
                <textarea class="form-control"
                          th:field="*{description}"
                          rows="4"
                          maxlength="1000"
                          required></textarea>
                <div class="form-text">Detailed author description (max 1000 characters)</div>
                <small class="text-danger" th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}"></small>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-dark w-100">Save Author</button>
        </form>
    </div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="editAuthorSheet">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">Edit Author</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <form id="editAuthorForm" th:action="@{/update-author/{id}(id=${author.id})}" method="post" th:object="${author}">
            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" th:field="*{name}" maxlength="100" required>
                <div class="form-text">Author title (max 100 characters)</div>
                <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label">Description <span class="text-danger">*</span></label>
                <textarea class="form-control" th:field="*{description}" rows="4" maxlength="1000" required></textarea>
                <div class="form-text">Detailed author description (max 1000 characters)</div>
                <small class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>
            </div>

            <button type="submit" class="btn btn-dark w-100">Update Author</button>
        </form>
    </div>
</div>


<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Edit Author OffCanvas Handler
        const editAuthorOffcanvas = document.getElementById('editAuthorSheet');

        editAuthorOffcanvas.addEventListener('show.bs.offcanvas', function(event) {
            const button = event.relatedTarget;
            const row = button.closest('tr');
            const authorId = button.getAttribute('data-author-id');

            // Get basic fields from table cells
            const cells = row.querySelectorAll('td');
            const name = cells[0].textContent;
            const description = cells[1].textContent.trim();

            // Get author IDs from data attributes
            const authorIds = [];
            cells[2].querySelectorAll('[data-author-id]').forEach(authorSpan => {
                authorIds.push(authorSpan.getAttribute('data-author-id'));
            });

            // Get form reference
            const form = document.querySelector('#editAuthorSheet form');

            // Update form action
            form.action = `/update-author/${authorId}`;

            // Set basic field values
            form.querySelector('[name="name"]').value = name;
            form.querySelector('[name="description"]').value = description;

            // Handle author multi-select
            const authorSelect = form.querySelector('[name="authorIds"]');
            Array.from(authorSelect.options).forEach(option => {
                option.selected = authorIds.includes(option.value);
            });
        });

        // Clear form on offcanvas hide
        editAuthorOffcanvas.addEventListener('hidden.bs.offcanvas', function() {
            const form = this.querySelector('form');
            form.reset();
            form.action = '';
            Array.from(form.querySelectorAll('option')).forEach(option => {
                option.selected = false;
            });
        });
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
